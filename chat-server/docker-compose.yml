services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yumaplayer_chat
      POSTGRES_USER: yumaplayer
      POSTGRES_PASSWORD: yumaplayer
    ports:
      - "5432:5432"
    volumes:
      - yumaplayer-chat-db:/var/lib/postgresql/data

volumes:
  yumaplayer-chat-db:
